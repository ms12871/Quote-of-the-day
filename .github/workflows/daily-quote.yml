name: Send Daily 8 AM Quote

on:
  schedule:
    # Run around both possible UTC times; the job below keeps only 8:00 AM
    # America/New_York, including daylight-saving changes.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pick quote and send notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail

          if [[ -z "$NTFY_TOPIC" ]]; then
            echo "::error::The NTFY_TOPIC repository secret is not configured."
            exit 1
          fi

          if [[ ! "$NTFY_TOPIC" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::NTFY_TOPIC contains invalid characters."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "$(TZ=America/New_York date +%H)" != "08" ]]; then
            echo "This run is not the 8:00 AM America/New_York window; skipping."
            exit 0
          fi

          python3 - <<'PY' | curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Title: Morning Motivation" \
            --header "Priority: default" \
            --header "Tags: sparkle,sunrise" \
            --data-binary @- \
            "https://ntfy.sh/${NTFY_TOPIC}"
          import datetime
          import json
          from pathlib import Path

          quotes = json.loads(Path("data/quotes.json").read_text())
          if not isinstance(quotes, list) or not quotes:
              raise SystemExit("data/quotes.json must contain at least one quote.")

          quote = quotes[datetime.date.today().timetuple().tm_yday % len(quotes)]
          if not isinstance(quote, dict) or not isinstance(quote.get("quote"), str):
              raise SystemExit("Each quote must contain a string named 'quote'.")

          message = f'"{quote["quote"]}"'
          if quote.get("author"):
              message += f' — {quote["author"]}'

          print(message)
          PY
