<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Daily Positive Quotes</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      --ink: #172033;
      --muted: #64748b;
      --accent: #e8794f;
      --accent-dark: #c65331;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 8%, rgba(251, 191, 36, 0.3), transparent 28%),
        radial-gradient(circle at 92% 90%, rgba(45, 212, 191, 0.2), transparent 32%),
        #f8f5ef;
      color: var(--ink);
    }

    .card {
      position: relative;
      isolation: isolate;
      width: min(100%, 620px);
      padding: clamp(2rem, 8vw, 4.5rem) clamp(1.25rem, 7vw, 4rem);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(86, 67, 45, 0.16);
      text-align: center;
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .card::before {
      position: absolute;
      z-index: -1;
      top: -70px;
      right: -55px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #fde68a;
      content: "";
      opacity: 0.65;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 1.5rem;
      color: var(--accent-dark);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    h1 {
      max-width: 470px;
      margin: 0 auto 1.5rem;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.15rem, 10vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    blockquote {
      margin: 0 auto 1.5rem;
      overflow-wrap: anywhere;
      color: #334155;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1.45;
    }

    cite {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .error {
      color: #b45309;
    }

    #quote-refresh {
      display: inline-block;
      margin: 2rem 0 0;
      padding: 9px 14px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    @media (max-width: 420px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .card {
        width: 100%;
        padding: 2rem 1.25rem;
        border-radius: 24px;
      }

      .eyebrow {
        margin-bottom: 1.25rem;
      }

      h1 {
        font-size: clamp(2rem, 12vw, 2.8rem);
      }

      blockquote {
        font-size: clamp(1.2rem, 6vw, 1.45rem);
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <p class="eyebrow">Your daily affirmation</p>
    <h1>Make space for good things.</h1>
    <blockquote id="quote-text">Loading today's quote...</blockquote>
    <cite id="quote-author"></cite>
    <p id="quote-refresh" aria-live="polite"></p>
  </main>

  <script>
    async function loadQuote() {
      const quoteText = document.getElementById("quote-text");
      const quoteAuthor = document.getElementById("quote-author");
      const quoteRefresh = document.getElementById("quote-refresh");

      try {
        const response = await fetch("/api/quote", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Quote API request failed: ${response.status}`);
        }

        const todayQuote = await response.json();
        if (!todayQuote || typeof todayQuote.quote !== "string") {
          throw new Error("Quote API returned invalid data.");
        }

        quoteText.textContent = `"${todayQuote.quote}"`;
        quoteAuthor.textContent = todayQuote.author
          ? `— ${todayQuote.author}`
          : "";
        quoteRefresh.textContent = `Changes every 2 hours · Next change at ${new Date(
          todayQuote.nextRefresh
        ).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;

        const refreshAt = new Date(todayQuote.nextRefresh).getTime();
        const delay = Math.max(refreshAt - Date.now() + 1000, 1000);
        window.setTimeout(loadQuote, delay);
      } catch (error) {
        console.error("Unable to load today's quote.", error);
        quoteText.textContent = "Make today a great day!";
        quoteText.classList.add("error");
        quoteAuthor.textContent = "";
        quoteRefresh.textContent = "";
      }
    }

    loadQuote();
  </script>
</body>
</html>
